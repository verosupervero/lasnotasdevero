baseURL = "https://www.lasnotasdevero.com/"
languageCode = 'es'
title = 'Las Notas de Vero'
theme = 'vero'

[params]
  # Keep the archived Netlify provider disabled; Firebase handles optional accounts.
  lucas_sync_enabled = false
  study_sync_enabled = true
  study_sync_provider = "firebase"
  # Requires explicit project configuration; no App Check requests while false.
  study_app_check_enabled = true
  # Enable before the first account rollout; then keep true even while sync is paused.
  study_private_storage = true

[markup]
  defaultMarkdownHandler = "goldmark"

  [markup.goldmark]
    [markup.goldmark.parser]
      attribute = true     # ¡ojo aquí!
    [markup.goldmark.renderer]
      unsafe    = true     # para que acepte HTML
